<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Student — Digital Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark"></span>
      Digital Attendance
    </a>
    <div class="nav-links">
      <a class="nav-link primary" href="/add_student">Add Student</a>
      <a class="nav-link" href="/mark_attendance">Mark Attendance</a>
      <a class="nav-link" href="/mark_attendance_classroom">Classroom Photo</a>
      <a class="nav-link" href="/attendance_record">Records</a>
      <a class="nav-link" href="/logout">Log Out</a>
    </div>
  </nav>

  <div class="page" style="max-width: 900px;">
    <div class="page-head">
      <div>
        <span class="eyebrow">Registration</span>
        <h1 style="margin:0; font-size:1.6rem;">Add Student</h1>
      </div>
    </div>

    <div class="card2">
      <span class="eyebrow">Student details</span>
      <form id="studentForm" class="mt-2">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="label2">Full name</label>
            <input class="input2" name="name" placeholder="e.g. Karan Bhadouriya" required>
          </div>
          <div class="col-md-3">
            <label class="label2">Roll no.</label>
            <input class="input2" name="roll" placeholder="23">
          </div>
          <div class="col-md-3">
            <label class="label2">Registration no.</label>
            <input class="input2" name="reg_no" placeholder="REG-0001">
          </div>
          <div class="col-md-12">
            <label class="label2">Enroll in class</label>
            <select class="input2" name="class_id" required>
              <option value="">Select class</option>
              {% for c in classes %}
              <option value="{{ c['id'] }}">{{ c['name'] }}{% if c['section'] %} — Sec {{ c['section'] }}{% endif %}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="mt-4 d-flex gap-2 flex-wrap">
          <button id="saveInfoBtn" type="submit" class="btn2 btn2-primary">Save Info</button>
          <button id="startCaptureBtn" type="button" class="btn2 btn2-teal" disabled>Start Capture (48)</button>
          <button id="addStudentBtn" type="button" class="btn2 btn2-outline" disabled>Add Student</button>
        </div>
      </form>
    </div>

    <div class="card2 mt-4">
      <span class="eyebrow">Face capture</span>
      <h5 style="margin:0 0 1rem;">Camera</h5>
      <div class="scan-frame" style="max-width:560px; margin:0 auto;">
        <video id="video" width="560" height="420" autoplay muted style="display:block; width:100%; height:auto;"></video>
        <div class="scan-corners">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="mt-3" style="max-width:560px; margin:0 auto;">
        <div id="poseInstruction" style="font-family:var(--font-display); font-size:1.1rem; font-weight:600; margin-bottom:0.5rem;"></div>
        <div id="captureStatus" class="mono" style="font-size:0.8rem; color:var(--ink-soft);">Captured 0 / 48</div>
        <div class="progress2 mt-2">
          <div id="progressBar" class="progress2-bar" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>

<script src="{{ url_for('static', filename='js/camera_add_student.js') }}"></script>
</body>
</html>
