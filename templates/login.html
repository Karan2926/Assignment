<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login — Digital Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-panel">
      <div class="d-flex align-items-center gap-2 mb-2">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="eyebrow" style="margin:0;">College attendance</span>
      </div>
      <h1 class="auth-brand">Digital Attendance</h1>
      <p class="auth-sub">Sign in to mark class, review records, or check your presence.</p>

      {% if error %}
      <div class="mono" style="color:#B91C1C; font-size:0.85rem; margin-bottom:1rem;">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <label class="label2">Username</label>
        <input class="input2 mb-3" name="username" required autocomplete="username">
        <label class="label2">Password</label>
        <input class="input2 mb-3" name="password" type="password" required autocomplete="current-password">
        <button type="submit" class="btn2 btn2-primary w-100">Log In</button>
      </form>
      <div class="mt-3 text-center">
        <a href="/register" class="auth-link">Student? Create an account</a>
      </div>
    </div>
  </div>
</body>
</html>
