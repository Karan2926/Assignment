<!doctype html>
<html>
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register — Digital Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
  <div class="page" style="max-width: 420px; margin-top: 4rem;">
    <div class="card2">
      <span class="eyebrow">Student sign-up</span>
      <h4 style="margin:0 0 1rem;">Create your account</h4>

      {% if error %}
      <div class="mono" style="color:#B91C1C; font-size:0.85rem; margin-bottom:1rem;">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <label class="label2">Your roll number</label>
        <input class="input2 mb-3" name="roll" required placeholder="Must match what your teacher added">
        <label class="label2">Choose a username</label>
        <input class="input2 mb-3" name="username" required>
        <label class="label2">Choose a password</label>
        <input class="input2 mb-3" name="password" type="password" required>
        <button type="submit" class="btn2 btn2-primary w-100">Create Account</button>
      </form>
      <div class="mt-3 text-center">
        <a href="/login" class="mono" style="font-size:0.8rem;">Already have an account? Log in</a>
      </div>
    </div>
  </div>
</body>
</html>
