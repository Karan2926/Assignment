<!doctype html>
<html>
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Mark Attendance — Digital Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark"></span>
      Digital Attendance
    </a>
    <div class="nav-links">
      <a class="nav-link" href="/add_student">Add Student</a>
      <a class="nav-link primary" href="/mark_attendance">Mark Attendance</a>
      <a class="nav-link" href="/mark_attendance_classroom">Classroom Photo</a>
      <a class="nav-link" href="/attendance_record">Records</a>
      <a class="nav-link" href="/logout">Log Out</a>
    </div>
  </nav>

  <div class="page" style="max-width: 1000px;">
    <div class="page-head">
      <div>
        <span class="eyebrow">Live recognition</span>
        <h1 style="margin:0; font-size:1.6rem;">Mark Attendance</h1>
      </div>
      <div class="d-flex gap-2">
        <button id="startMarkBtn" class="btn2 btn2-teal">Start</button>
        <button id="stopMarkBtn" class="btn2 btn2-danger" disabled>Stop</button>
      </div>
    </div>

    <div class="card2 mb-4">
      <span class="eyebrow">Session</span>
      <div class="session-bar mt-2">
        <div>
          <label class="label2">Class</label>
          <select id="classSelect" class="input2">
            <option value="">Select class</option>
            {% for c in classes %}
            <option value="{{ c['id'] }}">{{ c['name'] }}{% if c['section'] %} — Sec {{ c['section'] }}{% endif %}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="label2">Subject</label>
          <select id="subjectSelect" class="input2">
            <option value="">Select subject</option>
          </select>
        </div>
      </div>
      <p class="mono" style="font-size:0.8rem; color:var(--ink-soft); margin:0;">
        Attendance is saved once per student per class+subject per day.
      </p>
    </div>

    <div class="row g-4">
      <div class="col-md-7">
        <div class="card2">
          <div class="scan-frame">
            <video id="markVideo" width="560" height="420" autoplay muted style="display:block; width:100%; height:auto;"></video>
            <div class="scan-corners">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
          <div id="markStatus" class="mt-3 mono" style="font-size:0.8rem; color:var(--ink-soft);">Waiting...</div>
        </div>
      </div>

      <div class="col-md-5">
        <div class="card2">
          <span class="eyebrow">This session</span>
          <h5 style="margin:0 0 1rem;">Recognized</h5>
          <ul id="recognizedList" class="list-group" style="list-style:none; padding:0; margin:0;"></ul>
        </div>
      </div>
    </div>
  </div>

<script src="{{ url_for('static', filename='js/camera_mark.js') }}"></script>
</body>
</html>
